name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm run build

      # Coverage in place of a bare test run: the suite is the same, plus the
      # ratchet in vitest.config.ts. Build must precede it — the child-process
      # CLI tier executes dist/cli.cjs and refuses to run against a stale one.
      - run: pnpm coverage

      # Capability tier: real-browser certification (File/FormData/spark-md5
      # semantics jsdom can only approximate). Separate invocation, no
      # coverage coupling — same pattern as the backend's workerd tier.
      - run: npx playwright install chromium --with-deps

      - run: pnpm test:browser

      # The published artifact itself: exports map, CJS/ESM resolution, dts.
      - run: pnpm check:package

  publish:
    # Publishes fire on branch pushes only; PRs stop at the test gate.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # The version decides everything: skip when this version is already on
      # the registry (any push — workflow edits, docs — is a safe no-op, so
      # publishes are idempotent), and derive the dist-tag from the version —
      # prerelease versions (any `-` suffix) publish under `beta` so `latest`
      # keeps resolving the last stable; promoting a stable version needs no
      # workflow change. The branch decides only which pushes are eligible.
      - id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: pnpm run build

      - if: steps.version.outputs.publish == 'true'
        run: pnpm publish --access public --no-git-checks --provenance --tag "${{ steps.version.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - if: steps.version.outputs.publish == 'true'
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/ship ${{ steps.version.outputs.version }} published (${{ steps.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/ship publish failed"
