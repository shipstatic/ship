name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm run build

      # Coverage in place of a bare test run: the same suite, plus the ratchet in
      # vitest.config.ts. Build must precede it — the child-process CLI tier
      # executes dist/cli.cjs and refuses to run against a stale one.
      - run: pnpm coverage

      # Capability tier: real-browser certification of File/FormData/spark-md5
      # semantics jsdom can only approximate. Separate invocation, no coverage
      # coupling — same pattern as the backend's workerd tier.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:browser

      # The published artifact itself: exports map, CJS/ESM resolution, dts.
      - run: pnpm check:package


  # The publish decision is its own job because `publish`'s `environment:` is
  # evaluated before any step runs — it can only read another job's outputs.
  version:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # The VERSION decides the channel: a prerelease (any `-` suffix) goes to
          # `beta`, so `latest` keeps resolving the last stable release.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The BRANCH decides whether that channel may be published from here.
          # `latest` is main-only. A stable version on an integration branch is a
          # STAGED release, and staging one before merging is the normal flow — so
          # this skips rather than fails, exactly like the idempotence check below.
          if [[ "$TAG" == "latest" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::notice title=Release staged::$NAME@$VERSION is a stable version. latest publishes only from main, so nothing was published from $GITHUB_REF_NAME. Merge to main to release it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotence: once the version is on the registry, any push is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `npm-latest` carries a main-only deployment branch policy, so publishing
    # `latest` off `main` is refused by GitHub before a step runs.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`: it would write an `_authToken` line into .npmrc, and
      # npm reads that line — even with no token — as "token auth is configured"
      # and skips the OIDC handshake (actions/setup-node#1551).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # OIDC needs npm >= 11.5.1; node 22 bundles 10.x, and pnpm has no OIDC
      # support — hence `npm`, not `pnpm`, for the publish.
      - run: npm install -g npm@latest

      # Trusted publishing: no NODE_AUTH_TOKEN anywhere in this job — npm
      # authenticates with a token whenever one is present and attempts OIDC
      # only in its absence.
      - run: npm publish --access public --provenance --tag "${{ needs.version.outputs.tag }}"

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/ship ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/ship publish failed"
