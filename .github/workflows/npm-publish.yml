name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          registry-url: 'https://registry.npmjs.org'
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      
      - run: pnpm install
      
      - run: pnpm run build
      
      # The dist-tag derives from the version: prerelease versions (any `-`
      # suffix) publish under `beta` so `latest` keeps resolving the last
      # stable; promoting a stable version needs no workflow change.
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          pnpm publish --access public --no-git-checks --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      
      - if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: '{"text":"✅ @shipstatic/ship published successfully"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: '{"text":"🔴 @shipstatic/ship publish failed"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK