# The contract-drift detector on a schedule.
#
# `tests/e2e/smoke.e2e.test.ts` pins the same wire points the mock encodes
# (field names, error type strings, statuses, the 429 shape) against a REAL
# deployed API. The mock is a hand-maintained twin of `cloudflare/api`; this
# run is what catches drift between manual alignments — including drift
# introduced by API deploys that never touched this repo.
#
# It is deliberately NOT a publish gate, and that half of the 2026-08-12
# decision still stands: the dev API is deployed by hand and may legitimately
# lag this repo, so a red run means "these two disagree", not "this release is
# wrong". A schedule answers the other half — "inert config rots" — by
# construction, since a cron runs whether or not anyone remembers it.
#
# Opt-in by secrets, twice over: the job runs only when BOTH secrets are set.
# Requiring the URL too is deliberate — without it the harness defaults to
# PRODUCTION, and a scheduled run must never surprise-target prod (dev first,
# always). Point `SHIP_E2E_API_URL` at the dev environment. Hostnames live in
# secrets, never in this tracked file (the public-value law).
#
# One caveat worth knowing before hand-dispatching in a burst: the
# anonymous-ttl row spends a slot of the dev API's anonymous issuance budget
# per run (agent: 5/hr per IP), because the limiter runs before the
# orchestrator refuses. The daily cadence is far inside it; several dispatches
# inside one hour turn that row's `Forbidden` into a `RateLimit`. The row's own
# comment in `tests/contract.ts` carries the signature.

name: E2E

on:
  schedule:
    # Daily, off the top of the hour to dodge the cron thundering herd.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read the code and nothing else. This job holds a real API credential, so
    # its GITHUB_TOKEN is scoped to the least thing that still lets it check
    # out. By the one-job-one-credential law, the alerts webhook lives in
    # `notify` below rather than beside these secrets.
    permissions:
      contents: read
    env:
      SHIP_E2E_API_KEY: ${{ secrets.SHIP_E2E_API_KEY }}
      SHIP_E2E_API_URL: ${{ secrets.SHIP_E2E_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the e2e contract smoke
        if: env.SHIP_E2E_API_KEY != '' && env.SHIP_E2E_API_URL != ''
        run: pnpm test:e2e --run

      # An unconfigured run is not a broken one. It says so as a notice rather
      # than as a green run with nothing in it, so the verdict reads
      # "unconfigured" instead of "passed".
      - name: Note the missing secrets (not a failure)
        if: env.SHIP_E2E_API_KEY == '' || env.SHIP_E2E_API_URL == ''
        run: |
          echo "::notice title=E2E not configured::Set the SHIP_E2E_API_KEY and SHIP_E2E_API_URL repository secrets (a dev API key and the dev API URL) to run the contract smoke. See CLAUDE.md, 'The mock server'."

  # A red run on a push or a schedule reaches the operator's alerts channel for
  # its environment (production on main, development elsewhere); a pull
  # request's red already has a reader, its author. The webhook is a secret of
  # that environment, so only this job can read it. It runs nothing but curl,
  # and an unset secret fails it rather than skipping it. Root CLAUDE.md, "CI
  # notifications".
  notify:
    needs: [e2e]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 ship e2e contract smoke failed: the API may have drifted from the SDK's wire expectations"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set in the environment this run selected, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
